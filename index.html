<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inky | Personal Brand</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <!-- Site Header -->
  <header id="header">
    <nav>
      <img src="img/inky_logo_2.PNG" alt="small inky logo" height="50">
      <img src="img/menu_icon.png" alt="menu icon" height="50">
    </nav>
  </header>

  <!-- Main Site Content -->
  <main>

    <!-- Hero Section -->
    <section id="hero-wrapper">
      <div class="hero-container">

        <!-- Background and Main Logo -->
        <img id="white-paper" src="img/hero_paper.png" alt="hero paper bg">
        <img id="main-logo" src="img/inky_big_logo.PNG" alt="inky main logo" height="200">

        <!-- Tagline -->
        <div id="tagline">
          <img id="container" src="img/tagline_container.png" alt="tagline container">
          <h1 class="tagtext">
            <span class="regular">Where</span> <span class="bold-font">softness</span> <span class="regular">meets</span> <span class="bold-font">edge,</span><br>
            <span class="regular">and every design has</span> <span class="bold-font"><br>something to say</span>
          </h1>
          <img id="chibi-color" src="img/colour_chibi_me.PNG" height="150" alt="chibi owner">
        </div>

        <!-- Gifs -->
        <div id="gifs">
          <img id="gif-1" src="img/keyboard_.GIF" alt="cute gif" height="200">
          <img id="gif-2" src="img/keyboard_.GIF" alt="cute gif" height="200">
        </div>

      </div>
    </section>

	  
	  
    <!-- Stickers Section -->
    <section id="stickers">
      
		<div>
			<div>
				<img src="img/cute_monster_bird.PNG" alt="cute monster" height="210">
			</div>
			
			<div id="quote">
				<span class="bold-fontlarge">Chaos    </span><span class="regular"> is <br> a </span><span class="bold-fontmedium">part </span><span class="regular"> of the <br></span><span class="bold-fontlarge">Pallette</span>
			</div>
			
			
			<div>
				<img id="banana" src="img/banana_spider.PNG" alt="banana fruit spider drawing" height="200">
			</div>
			
			
		</div>
		
		
		<div>
			<div id="skateboard">
				<img src="img/flower_skateboard.png" alt="flower skateboard" height="410">
			</div>
				
			<div id="pumpkin">
			
				<img src="img/pimpkin.PNG" alt="pumpkin" height="210">
			
			</div>
			
		</div>
		
    </section>

	  
	  
    <section id="gallery">
  <div id="gallery-title">
    <span class="bold-fontlarge">GALLERY</span>
  </div>

  <div class="carousel-wrapper">
    <div class="carousel" id="carousel">
      <div class="carousel-track" id="carousel-track">
        <img class="carousel-img" src="img/adeogun_independent.png" alt="animal crossing illustration">
        <img class="carousel-img" src="img/fashion_poster_mockup.png" alt="fashion show poster">
        <img class="carousel-img" src="img/wallpaper.png" alt="halloween wrapping paper">
        <img class="carousel-img" src="img/IMG_5594.jpeg" alt="english breakfast painting">
      </div>
	 </div>
  </div>
		
		<button class="view-all-btn">View All</button>
		
</section>


	  
    <!-- About Section -->
    <section id="about">
     
		<div id="polaroid-cont">
			<img id="polaroid" src="img/lads_me.PNG" height="328" alt="Love and Deepspace OC Illustration">
		</div>
		
		<div id="about-btn">
			<button class="about-me">About Me</button>
		</div>
		
		<div>
			<img id="chibi-toon" src="img/toon_me.PNG" height="300" alt="Cartoon Illustration of Alexandra Adeogun">
		</div>
			
    </section>

  </main>

  <!-- Footer -->
  <footer id="footer">
    <div class="footer-container">
	  <p>© 2025 Alexandra Adeogun &nbsp; All rights reserved</p>
		<p>Based in Windsor, Ontario | Portfolio by Inky Studio</p>
		<p>Contact: <a href="mailto:adeogun.design@gmail.com">adeogun_design@gmail,com</a></p>
		<p> <a href="brand-guide.html" target="_blank">View My Brand Guide</a></p>
	  </div>
  </footer>

</body>
</html>
